# BBIPL Vision Compliance Engine - Business Rules Configuration
# Modify this file to update business rules without changing code

uniform:
  tshirt_required: true
  tshirt_colors:
    - Red
  confidence_threshold: 70

cap:
  required: true
  colors:
    - Red

gloves:
  required: false
  enabled: true

apron:
  required: false
  enabled: true

mask:
  required: false
  enabled: true

hairnet:
  required: false
  enabled: false

id_card:
  required: false
  enabled: true

jacket:
  required: false
  enabled: false

# Detection thresholds — fine-tuned for real-world selfies
minimum_face_size: 5          # % of frame (lowered from 30 — normal selfies are ~5-10%)
maximum_face_size: 70         # % of frame
minimum_blur_score: 20        # 0-100 (adjusted for real-world selfies)
minimum_visibility: 75        # 0-100
minimum_brightness: 50        # 0-100
minimum_overall_score: 80     # Overall compliance pass threshold
